<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- White rounded background -->
  <rect width="120" height="120" rx="22" fill="#ffffff"/>

  <!-- ═══════════════ letter "a" — green ═══════════════ -->
  <text x="6" y="92"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-weight="900" font-size="78" fill="#1f8a37">a</text>

  <!-- ═══════════════ letter "g" — orange ═══════════════ -->
  <text x="54" y="92"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-weight="900" font-size="78" fill="#F47920">g</text>

  <!-- ═══════════════ two leaves sprouting from the "a" ═══════════════ -->
  <g transform="translate(38,30)">
    <!-- left leaf -->
    <path d="M2 8 C-10 2 -16 -8 -8 -16 C2 -10 6 0 2 8 Z" fill="#3fae3f"/>
    <!-- right leaf (bigger) -->
    <path d="M4 6 C8 -10 22 -16 30 -10 C26 6 12 12 4 6 Z" fill="#2e9b2e"/>
    <!-- little stem -->
    <path d="M3 9 C3 2 4 -4 7 -9" stroke="#2e9b2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
